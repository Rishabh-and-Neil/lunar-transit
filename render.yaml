# Single Render web service: Node serves the multiplayer Socket.IO server AND the built web client.
# A free Postgres database keeps the global leaderboards across restarts and deploys.
services:
  - type: web
    name: lunar-transit
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w apps/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: lunar-transit-db
          property: connectionString

databases:
  - name: lunar-transit-db
    plan: free
    databaseName: lunar_transit
    user: lunar_transit
